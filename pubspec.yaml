name: reserva_if
description: "reservaIF - agendamento de salas do IFES."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  intl: ^0.20.2
  table_calendar: ^3.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  web: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo_splash.png
